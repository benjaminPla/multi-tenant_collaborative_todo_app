jobs:
  clippy:
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - run: cargo clippy --all-targets --locked -- -D warnings

  unit:
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - run: cargo test --locked

name: unit_test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
