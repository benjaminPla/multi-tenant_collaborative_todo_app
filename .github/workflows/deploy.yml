concurrency:
  cancel-in-progress: false
  group: deploy

jobs:
  deploy:
    needs: [integration_test, migrate, unit_test]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "deploy backend and frontend here"

  integration_test:
    needs: migrate
    uses: ./.github/workflows/integration_test.yml

  migrate:
    secrets: inherit
    uses: ./.github/workflows/migrate.yml

  unit_test:
    needs: migrate
    uses: ./.github/workflows/unit_test.yml

name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
